<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="contact-box">
        <h1 class="dial-emoji">📞</h1>
        <h2>Phone number</h2>
        <p>Would you like a new OpenPhone number, or <br />
            want to port your existing number over?
        </p>
        <div class="brand-new-number">
            <div class="option-flex">
                <p>🎁</p>
                <p>Brand new number</p>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
            </svg>
        </div>

        <div class="existing-number">
            <p>➡️</p>
            <p>Port existing number</p>
        </div>

        <p class="card-footer">Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur iusto officia tempora, ad dignissimos dolores?</p>

    </div>
</body>
</html>
