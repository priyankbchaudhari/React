<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <!-- Netflix clone-  https://github.com/akshkgd/frontend-cohort/tree/main/netflix -->

    <section>
        <div class="hero">
            <img class="hero-img" src="./hero.jpg" />
            <div class="tint"></div>

            <div class="nav">
                <a class="logo" href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" fill="none" viewBox="0 0 370 100">
                        <path fill="#e50914"
                            d="M50.83 93.54V0H35.21v56.77L14.9 0H0v100c5.31-.83 10.31-1.56 15.94-2.19V43.23l17.81 52.4c5.94-.84 11.56-1.15 17.08-2.09m30.84-56.87V15.63h27.6V0H66.04v92.3l43.23-3.45v-15c-9.27.32-18.44 1.05-27.6 1.67V52.3c5.83-.31 13.95-.31 20.83-.31V36.35c-5.52 0-14.8.32-20.83.32m85.73-21.04V0h-48.03v15.63h16.15V87.7c5.1-.21 10.42-.21 15.63-.21V15.63zm25.41 19.9v-19.9h28.34V0H177.4v86.67h15.41V51.15h21.36V35.52zm53.65 37.39V0h-15.63v87.7a930 930 0 0 1 42.2 2.1V74.26c-8.65-.42-17.61-1.14-26.57-1.35m39.79 17.91c5 .32 10.2.52 15.31 1.15V0h-15.31zM370 0h-17.08l-10.94 26.25L331.78 0H314.9l18.23 46.98-20.1 45.83c5.62.73 11.14 1.04 16.76 1.98l11.46-26.56 11.15 28.96c5.93.94 11.77 1.98 17.6 2.81l-19.8-52.4z" />
                    </svg>
                </a>
                <div class="nav-flex">
                    <button class="en-btn">English</button>
                    <button class="login-btn">Sign in</button>
                </div>
            </div>

            <div class="content">
                <h1 class="title">Unlimited movies, shows, and more</h1>
                <p class="sub-title">Plans start at ₹149. Cancel anytime.</p>
                <p class="ready">Ready to watch? Enter your email to start your membership.</p>
                <div class="content-flex">
                    <input type="text" class="content-input" name="txtemail" id="txtemailId"
                        placeholder="Email address" />
                    <button class="content-btn">
                        <!-- Try 30 Days for ₹0 -->
                        <span>Try 30 Days for ₹0</span>
                        <span class="mg-top">
                            <svg width="24" height="24" data-icon="ChevronRightMedium" data-icon-id=":r4:"
                                aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" role="img">
                                <path fill="currentColor" fill-rule="evenodd"
                                    d="m15.586 12-7.293 7.293 1.414 1.414 8-8a1 1 0 0 0 0-1.414l-8-8-1.414 1.414z"
                                    clip-rule="evenodd"></path>
                            </svg>
                        </span>
                    </button>
                </div>
                <p>New members only. Terms below.</p>
            </div>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="left">
                <h1 class="heading">Enjoy on your TV</h1>
                <p class="sub-heading">
                    Watch on smart TVs, PlayStation, Xbox, Chromecast, Apple TV, Blu-ray players and more.
                </p>
            </div>
            <div class="right">
                <div class="real-tv">
                    <video src="./video.m4v" autoplay muted class="video"></video>
                    <img class="tvimg" src="./tv.png" alt="">
                </div>
            </div>
        </div>
    </section>

</body>

</html>
